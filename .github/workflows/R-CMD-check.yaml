# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
# A push to a branch that has an open pull request fires both `push` and
# `pull_request`, so an unfiltered trigger ran the four-job matrix twice for
# every push. With a stacked set of pull requests that is eight runs for one
# propagated fix, and the queue never drained. Every other workflow here already
# filters; this one did not.
#
# The queue is not a serial one. A run's four jobs start a median 0.1 minutes
# apart, so the cells run in parallel, and #333 measured more than twelve
# R-CMD-check jobs running at once. Halving the number of runs is worth doing
# whether or not they queue. See `notes/ci_devel_cancellation.md`.
#
# `push` is now limited to the integration branches, and a branch with a pull
# request is still checked through `pull_request`. Nothing loses coverage: a
# stacked branch is checked on its own pull request, and again once GitHub
# retargets that pull request to `dev` as the one below it merges.
on:
  push:
    branches: [master, dev]
  pull_request:
  # The worker count is computed on the runner, which means it cannot be varied
  # for measurement without editing this file -- and editing it changes the tree
  # being measured. The input exists so one setting can be held while everything
  # else stays fixed. Blank means "use the computed value", so an ordinary push or
  # pull_request run takes exactly the same path it would without the input.
  workflow_dispatch:
    inputs:
      testthat_cpus:
        description: 'testthat worker count; blank uses the value computed from the runner'
        required: false
        default: ''

# Supersede rather than queue. Pushing a correction to a branch whose check is
# still running made both run to completion, and only the second was ever read.
# A run stopped this way reports every unfinished job as `cancelled`.
#
# Do not read a cancelled `ubuntu-latest (devel)` job as evidence about the
# branch it ran on. It records that a newer commit exists on that pull request,
# and the newer commit is the one checked. Measured 2026-09-13 over 197 runs, 44
# of the 64 cancellations stopped all four jobs before any had finished, and of
# the 30 most recently merged pull requests, 30 had a successful devel check on
# the head commit completed before the merge. None merged without one.
#
# #333 proposed exempting devel from cancellation or shortening it. Both were
# rejected: exemption adds nothing to that coverage, and devel is not the slowest
# job here -- it runs 1.5 to 3.6 minutes longer than `ubuntu-latest (release)`
# and 5.3 to 7.4 minutes shorter than `windows-latest`. Exempting devel would
# also take more than a per-cell concurrency group, because this workflow-level
# `cancel-in-progress` stops the run before any job-level group applies.
#
# `notes/ci_devel_cancellation.md` holds the measurement, the day-by-day rate,
# and what a rate quoted over a whole window does and does not describe.
# `notes/scripts/ci_devel_cancellation.R` reproduces all of it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          # - {os: ubuntu-latest,   r: 'oldrel-1'}

    # The default job timeout is six hours. Two terminations on this repository
    # arrived as a bare exit 143 partway through the test phase with no timing
    # line and no cause, and neither was a timeout, so neither could be told from
    # a job that was merely slow. A bound above the longest observed job makes a
    # hang a deterministic event at a known boundary instead. See #328.
    #
    # This was set against a 42-minute maximum, which #333 superseded: the
    # longest devel job to reach a conclusion took 72.7 minutes, and five ran
    # past 70. Against that maximum the margin is only about 1.24 times, but the
    # maximum is one afternoon: seven of the eight longest devel jobs started on
    # one day and six of those failed. Against the 95th centile of the
    # distribution, which is where the routine work sits, 90 is roughly half as
    # long again -- the centile itself drifts with the sample and is recorded,
    # dated, in `notes/ci_devel_cancellation.md`. It is left at 90. Nothing of
    # any cell has reached it in 583 completed observations, and the
    # `if: always()` log dump below makes a timeout diagnosable if one fires.
    timeout-minutes: 90

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v3
      - uses: r-lib/actions/setup-pandoc@v2-branch
      - uses: r-lib/actions/setup-r@v2-branch
        with:
          r-version: ${{ matrix.config.r }}
          rtools-version: ${{ matrix.config.rtools-version }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Pandoc Windows fix
        if: runner.os == 'Windows'
        run: choco install pandoc

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            rcmdcheck
            BH
            stan-dev/cmdstanr
            RcppEigen

      # Pins StanHeaders on Windows. CRAN rstan 2.32.7 declares
      # `StanHeaders (>= 2.32.0)` with no upper bound, so pak correctly resolves
      # to StanHeaders 2.39.1 (published 2026-09-02); rstan 2.32.7 then cannot
      # compile a model on Windows, and every brm() call fails with
      # "invalid connection". See #275. macOS and Ubuntu pass with that same
      # pair, so the pin is applied only where the failure occurs and the other
      # three jobs keep checking against current CRAN.
      #
      # The dated snapshot serves StanHeaders 2.32.10 -- the last 2.32 release,
      # and the version installed by the most recent green Windows run
      # (dev bc5f7d00, 2026-09-02 04:55 UTC, before 2.39.1 was published at
      # 12:10 UTC that day). Remove this step once CRAN rstan is released
      # against StanHeaders 2.39 or later.
      #
      # The version is asserted rather than assumed: install.packages() only
      # warns when a repository is unreachable, so without the check an
      # unreachable snapshot would leave 2.39.1 in place and reproduce #275
      # after a 30-minute test run instead of failing here with a named cause.
      - name: Pin StanHeaders to a version rstan can compile against
        if: runner.os == 'Windows'
        run: |
          install.packages("StanHeaders", repos = "https://packagemanager.posit.co/cran/2026-09-02")
          sh <- packageVersion("StanHeaders")
          rs <- packageVersion("rstan")
          if (!grepl("^2[.]32[.]", sh)) {
            stop("StanHeaders ", sh, " is installed but 2.32.x is required to ",
                 "match rstan ", rs, "; see #275")
          }
          cat("StanHeaders", format(sh), "with rstan", format(rs), "\n")
        shell: Rscript {0}

      # Configures the Rtools toolchain on Windows. It no longer installs
      # StanHeaders or rstan from https://mc-stan.org/r-packages/. Those two
      # `install.packages()` calls were added in 7c52e186 (2022-11-01) to obtain
      # a preview rstan for R 4.2; CRAN rstan supports current R, and neither
      # `rstantools` nor `cmdstanr` is a dependency of this package, so the
      # preview build is no longer needed. They also passed the mc-stan index
      # and `getOption("repos")` together, which is a fallback list rather than
      # a preference, so an unreachable index installed from CRAN without
      # erroring -- a second, intermittent source of the same version skew.
      - name: Use Cmdstan to Fix
        run: |
          cmdstanr::check_cmdstan_toolchain(fix = TRUE)
        shell: Rscript {0}

      # Nothing here sets a worker count on an ordinary run: testthat takes its
      # own default of two and this matrix is configured exactly as dev is.
      #
      # The step exists as an instrument, not a policy. While the count was
      # computed in this file it could not be varied for measurement, because
      # varying it meant editing the file and editing the file changed the tree
      # being measured. Holding one setting through workflow_dispatch is what made
      # a paired comparison possible, and #328 records what that comparison found
      # and why the question is closed rather than deferred. It does nothing
      # unless an input is supplied.
      - name: Override the testthat worker count, if one was requested
        if: github.event.inputs.testthat_cpus != ''
        env:
          WORKER_OVERRIDE: ${{ github.event.inputs.testthat_cpus }}
        run: |
          workers <- suppressWarnings(as.integer(Sys.getenv("WORKER_OVERRIDE")))
          if (is.na(workers) || workers < 1L) {
            stop("testthat_cpus must be a positive integer, not '",
                 Sys.getenv("WORKER_OVERRIDE"), "'")
          }
          cat("overriding the testthat worker count to", workers, "\n")
          cat(sprintf("TESTTHAT_CPUS=%d\n", workers),
              file = Sys.getenv("GITHUB_ENV"), append = TRUE)
        shell: Rscript {0}

      # Vignettes ARE built and checked. They are precompiled -- precompile.R
      # renders every .Rmd.orig to a .Rmd whose chunks are display-only -- so
      # building them is markdown to HTML and costs ~16s, not a refit. Skipping
      # them meant nothing in CI had ever checked a vignette, and the first
      # check of them was the release precompile. See #190.
      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual")'
          args: 'c("--no-manual", "--as-cran")'
          upload-snapshots: true

      # The action's own "Show testthat output" step reported outcome=skipped on
      # both terminations, so neither left any record of which file the suite had
      # reached. This one runs whatever happened, including on a cancellation or a
      # timeout, which is the case that needs it.
      - name: Show the test log, whatever happened
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          found=0
          for f in check/*.Rcheck/tests/testthat.Rout check/*.Rcheck/tests/testthat.Rout.fail; do
            echo "::group::$f"
            tail -n 200 "$f" || true
            echo "::endgroup::"
            found=1
          done
          if [ "$found" = "0" ]; then
            echo "no testthat.Rout found under check/*.Rcheck/tests/"
          fi
