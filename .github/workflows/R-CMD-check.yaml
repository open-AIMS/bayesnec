name: R-CMD-check
run-name: PR 402 full worker result trace

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-result-trace:
    name: ubuntu-latest (devel, full worker result trace)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: 'true'
      TESTTHAT_PARALLEL: 'true'
      TESTTHAT_CPUS: '1'

    steps:
      - uses: actions/checkout@v3
      - uses: r-lib/actions/setup-pandoc@v2-branch
      - uses: r-lib/actions/setup-r@v2-branch
        with:
          r-version: devel
          http-user-agent: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            rcmdcheck
            BH
            stan-dev/cmdstanr
            RcppEigen
      - name: Check the existing Stan toolchain
        run: cmdstanr::check_cmdstan_toolchain(fix = TRUE)
        shell: Rscript {0}
      - name: Install the PR package
        run: R CMD INSTALL --no-docs .
        shell: bash
      - name: Trace all worker results
        shell: bash
        run: |
          cat >> tests/testthat/setup.R <<'RS'
          testthat:::SubprocessReporter$set(
            "public", "add_result",
            function(context, test, result) {
              cat("REPORTER_RESULT", private$filename, test,
                  class(result)[1], as.numeric(utils::object.size(result)),
                  "\n", file = stderr())
              private$event("add_result", context, test, result)
            },
            overwrite = TRUE
          )
          RS
          Rscript - <<'RS' 2>&1 | tee "$RUNNER_TEMP/pr402-worker-file-order.log"
          set.seed(402)
          cat(R.version.string, "\n")
          cat("TESTTHAT_PARALLEL=", Sys.getenv("TESTTHAT_PARALLEL"), "\n", sep = "")
          cat("TESTTHAT_CPUS=", Sys.getenv("TESTTHAT_CPUS"), "\n", sep = "")
          setwd("tests")
          testthat::test_check("bayesnec")
          RS
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr402-worker-file-order-log
          path: ${{ runner.temp }}/pr402-worker-file-order.log
          retention-days: 7
