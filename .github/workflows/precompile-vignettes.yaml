# Manually-triggered vignette precompilation (#215, and the mechanism for #190).
#
# `vignettes/*.Rmd` are generated from `*.Rmd.orig` by `vignettes/precompile.R`,
# which fits every model in every vignette. That is hours of compute and needs a
# working Stan toolchain, so it cannot run on push. Without it, though, a
# vignette edited on `dev` is unreadable in rendered form until a contributor
# precompiles locally -- which is the complaint in #215.
#
# So: run it on demand. Dispatch this workflow against a branch and it opens a
# PR with the regenerated `.Rmd` files and figures. It deliberately does not
# push to the branch directly: precompilation changes every number in every
# vignette, and that is a diff someone should look at.
on:
  workflow_dispatch:
    inputs:
      vignettes:
        description: >-
          Comma-separated vignette basenames to rebuild (e.g. example1,example4).
          Leave blank to rebuild all of them -- slow, and what #190 wants.
        required: false
        default: ''

name: precompile vignettes

jobs:
  precompile:
    runs-on: ubuntu-latest
    # precompile.R fits every model in every vignette. The default 6h ceiling is
    # the real constraint here, not this number; if a full run approaches it,
    # rebuild vignettes in batches using the `vignettes` input.
    timeout-minutes: 350
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::knitr, any::purrr, any::rmarkdown, local::.
          needs: check

      # Compiled Stan models are the bulk of the cost and they do not change
      # between runs unless the model code does, so key the cache on sysdata.rda
      # and the pred equations rather than on a lockfile.
      - name: Cache compiled Stan models
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: stan-${{ runner.os }}-${{ hashFiles('R/sysdata.rda', 'R/pred_equations.R') }}
          restore-keys: stan-${{ runner.os }}-

      - name: Precompile
        run: |
          sel <- Sys.getenv("VIGNETTE_SELECTION")
          if (nzchar(sel)) {
            keep <- trimws(strsplit(sel, ",")[[1]])
            cat("Rebuilding only:", paste(keep, collapse = ", "), "\n")
            all_orig <- dir("vignettes", pattern = "\\.Rmd\\.orig$")
            drop <- setdiff(tools::file_path_sans_ext(
              tools::file_path_sans_ext(all_orig)), keep)
            # precompile.R globs the directory, so hide the ones we are not
            # rebuilding rather than reimplementing its loop here.
            dir.create(".precompile_held", showWarnings = FALSE)
            for (d in drop) {
              file.rename(file.path("vignettes", paste0(d, ".Rmd.orig")),
                          file.path(".precompile_held", paste0(d, ".Rmd.orig")))
            }
            on.exit({
              for (f in dir(".precompile_held")) {
                file.rename(file.path(".precompile_held", f),
                            file.path("vignettes", f))
              }
              unlink(".precompile_held", recursive = TRUE)
            }, add = TRUE)
          }
          source("vignettes/precompile.R")
        shell: Rscript {0}
        env:
          VIGNETTE_SELECTION: ${{ inputs.vignettes }}

      - name: Open a PR with the rebuilt vignettes
        uses: peter-evans/create-pull-request@v6
        with:
          branch: precompile/${{ github.ref_name }}
          base: ${{ github.ref_name }}
          title: "Rebuild precompiled vignettes from ${{ github.ref_name }}"
          commit-message: "rebuild precompiled vignettes"
          add-paths: |
            vignettes/*.Rmd
            vignettes/*.png
          body: >-
            Regenerated by the `precompile vignettes` workflow from
            `${{ github.ref_name }}`.


            Every number in these vignettes comes from a fresh fit, so expect the
            whole diff to change even where the prose did not. Read it for
            *plausibility* -- a curve that has moved, an estimate that has
            changed sign, an unresolved reference -- rather than line by line.
