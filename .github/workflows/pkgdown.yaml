on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

name: pkgdown

# github-pages-deploy-action pushes to gh-pages, which needs write access to
# repository contents. Relying on the repository's default workflow permissions
# leaves the deploy dependent on a setting that is read-only by default on
# newer repositories. See #230.
permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # `clean: false` is what lets the two sites coexist. A build from `master`
      # writes docs/ at the root and leaves docs/dev/ untouched; a build from
      # `dev` writes only docs/dev/ (see `development: mode: auto` in
      # _pkgdown.yml) and leaves the root untouched. Turning cleaning on would
      # make whichever branch published last delete the other one.
      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
