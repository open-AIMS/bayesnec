url: https://open-aims.github.io/bayesnec

template:
  params:
    bootswatch: yeti

# Development mode "auto" keys off the version in DESCRIPTION, but NOT in the way
# an earlier version of this comment claimed. pkgdown:::dev_mode_auto() returns
# "devel" for ANY version with four or more components whose first three are not
# 0.0.0 -- the size of the fourth component is irrelevant. So:
#
#   dev_mode_auto("2.1.3.1")  -> "devel"    <- master today
#   dev_mode_auto("2.1.3.12") -> "devel"    <- dev today
#   dev_mode_auto("2.1.4")    -> "release"
#
# `master` is at 2.1.3.1, a four-component version, so it currently resolves to
# devel as well and would publish into /dev/ rather than the root. This works
# only while releases carry a THREE-component version; bayesnec has historically
# released four-component ones (2.1.3.1 is on CRAN), and that is the
# incompatibility. ssdtools relies on the same rule deliberately -- its main
# branch carries 2.6.0.9002 and publishes to /dev/, with the root published on
# release at a three-component version.
#
# So this is a versioning convention, not a config setting: cut releases as
# x.y.z and the two sites separate correctly; cut one as x.y.z.n and they
# collide again, silently. See #230.
development:
  mode: auto

# The articles index and the Articles dropdown are both ordered from this block.
# Without it pkgdown lists the vignettes alphabetically by file name, which is
# the order in which they happened to be written rather than a reading order.
# See #363 for the cross-reference audit the order below follows: no vignette is
# placed before one it sends the reader to.
#
# The `navbar:` keys are not decoration. `pkgdown:::navbar_articles()` replaces
# the Articles dropdown with a plain link to the index as soon as an `articles:`
# block exists and no section sets `navbar:`, so omitting them would drop the
# dropdown rather than reorder it. A section whose `navbar:` is a string gets a
# divider and that heading in the dropdown; `navbar: ~` on the first section
# gives its entries with no leading divider. All four sections are listed, so
# the dropdown holds every vignette and pkgdown appends no "More articles..."
# link.
#
# `data_articles_index()` aborts the build on a vignette that is present but
# unlisted, so this block cannot diverge from the vignettes without the build
# saying so. A vignette added with no entry here fails the pkgdown job.
# `example8` is added by #228 alongside the vignette itself, under `Designs and
# response types`.
articles:
  - title: Getting started
    navbar: ~
    contents:
      - example5
      - example1
      - example2
      - example2b
  - title: Extending the analysis
    navbar: Extending the analysis
    contents:
      - example3
      - example4
  - title: Designs and response types
    navbar: Designs and response types
    contents:
      - example6
      - example7
  - title: A worked analysis
    navbar: A worked analysis
    contents:
      - example9
